storage:
  root: data/raw/premigration

pumpportal:
  url: null

dexscreener:
  enabled: true
  max_requests_per_minute: 240
  batch_size: 30

polling:
  fresh_empty_seconds: 10
  fresh_empty_minutes: 10
  min_seconds: 10
  max_seconds: 300
  idle_sleep_seconds: 2
  max_track_hours: 24

dashboard:
  enabled: true
  interval_seconds: 30

dead_detection:
  no_pair_after_minutes: 60
  inactive_after_minutes: 45
  inactive_confirmations: 3
  max_volume_m5_usd: 0
  max_txns_m5: 0

selection:
  migration_market_cap_usd: 69000
  trigger_fraction: 0.5
  market_cap_random_sample:
    enabled: true
    limit_rate: 0.05
    interval_fraction_of_trigger: 0.1
    lower_interval_fraction: 0.7

enrichment_limits:
  security_per_minute: 30
  twitter_lite_per_minute: 3
  telegram_lite_per_minute: 3
  website_per_minute: 6

enrichment:
  security:
    enabled: true
  twitter_lite:
    enabled: true
  telegram_lite:
    enabled: true
  website:
    enabled: true
