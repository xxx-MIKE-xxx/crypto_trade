onchain:
  capture_time: 300
  rpc_interval: 10
  infer_vaults_limit: 10
  performance_sample_limit: 60
  max_signatures_per_address: null
  max_transactions_total: null
  simulate_tx_base64: null

failed_tx_capture:
  enabled: true
  log_subscribe: true
  max_addresses: 6
  fetch_failed_transactions: true
  sample_interval_seconds: 60
  fetches_per_interval: 3

security:
  enabled: true
  cancel_on_red_flags: true
  red_flags_config: config/red_flags.yaml

holder_snapshots:
  enabled: true
  largest_accounts: true
  token_accounts: selected_only
  address_transactions: selected_only
  schedule:
    - label: migration
      delay_seconds: 0
    - label: migration_plus_5m
      delay_seconds: 300
    - label: migration_plus_30m
      delay_seconds: 1800
  token_accounts_schedule:
    - label: migration
      delay_seconds: 0
    - label: migration_plus_1h
      delay_seconds: 3600
  token_accounts_page_limit: 100
  token_accounts_max_pages: 5
  token_accounts_max_accounts: 500

jupiter_quotes:
  enabled: true
  interval_seconds: 15
  length_seconds: 1800
  slippage_bps: 300
  restrict_intermediate_tokens: true
  only_direct_routes: false
  buy_sol_amounts: [0.05, 0.1, 0.25, 0.5, 1.0, 2.0, 5.0]
  sell_base_sol_amounts: [0.1, 1.0]
  sell_fractions: [0.25, 0.5, 1.0]

analytics:
  website_enabled: true
  twitter_enabled: true
  telegram_enabled: true
  dexscreener_enrichment_enabled: true
  twitter_posts_limit: 20

dexscreener:
  enabled: true
  use_shared_queue: true
  post_migration_interval_seconds: 30
  length: 1800

drop:
  keep_partial_onchain: true
  backfill_on_cancel: false
